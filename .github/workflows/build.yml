name: Build Windows Exe

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies & Build Exe
        run: |
          npm install electron electron-packager --save-dev
          npx electron-packager . 3D GLB MODEL STUDIO --platform=win32 --arch=x64 --out=dist --overwrite

      - name: Upload Exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3D GLB MODEL STUDIO
          path: dist/3D GLB MODEL STUDIO-win32-x64/
